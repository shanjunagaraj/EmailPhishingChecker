<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email ID Checker</title>

    <link rel="stylesheet" href="css/style.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="container">

        <div class="card checker-card">

            <h1>📧 Email ID Checker</h1>

            <p class="subtitle">
                Enter the sender's email address to check whether it is safe or suspicious.
            </p>

            <div class="input-group">

                <label for="email">
                    Sender Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter sender email">

            </div>

            <button id="checkBtn">
                Check Email
            </button>

             <!-- Hidden initially  -->
            <div class="result" id="result">

                <h2>Email Analysis Result</h2>

                <p><strong>Username :</strong> <span id="usernamePart">-</span></p>

                <p><strong>Domain :</strong> <span id="domainPart">-</span></p>

                <p><strong>Status :</strong> <span id="status">Safe</span></p>

                <p><strong>Risk Score :</strong> <span id="risk">10%</span></p>

                <div class="reason">

                    <h3>Reasons</h3>

                    <ul id="reasonList">
                        <li>Valid email format</li>
                        <li>Trusted domain</li>
                    </ul>

                </div>

            </div>

            <button onclick="window.location.href='index.html'">
                 ← Back to Home
            </button>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
