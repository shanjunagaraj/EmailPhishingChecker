<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Website Title -->
    <title>🛡️  Email Phishing Checker</title>

    <!-- CSS File -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <!-- Heading -->
        <h1>🛡️  Email Phishing Checker</h1>

        <!-- Description -->
        <p class="subtitle">
            Protect yourself from phishing attacks by analyzing email addresses and email content.
        </p>

        <!-- Cards -->
        <div class="card-container">

            <!-- Email ID Card -->
            <div class="card">

                <div class="icon">📧</div>

                <h2>Email ID Checker</h2>

                <p>
                    Check whether the sender's email address is safe or suspicious.
                </p>

                <button onclick="goToEmailID()">
                   Check Email ID →
                </button>

            </div>

            <!-- Email Content Card -->
            <div class="card">

                <div class="icon">📝</div>

                <h2>Email Content Checker</h2>

                <p>
                    Analyze email content for phishing keywords and suspicious messages.
                </p>

                <button onclick="goToContent()">
                    Analyze Content →
                </button>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
